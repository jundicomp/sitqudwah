<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="robots" content="noindex" />
  <title>Sedang Diperbarui — Siskom Qudwah</title>
  <meta name="sq-halaman" content="HALAMAN-PEMELIHARAAN-SQ" />
  <!--
    HALAMAN PEMELIHARAAN SEMENTARA
    Dipasang menggantikan index.html selama deploy (bisa dipakai berulang kali).
    Tiap 20 detik halaman ini mengambil ulang index.html dari server: selama isinya masih
    halaman ini (penanda HALAMAN-PEMELIHARAAN-SQ), user tetap menunggu. Begitu index.html
    asli aplikasi sudah tayang lagi, halaman otomatis membuka aplikasi.
  -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#123D22;color:#17261C;display:flex;align-items:center;justify-content:center;padding:20px;
      background-image:radial-gradient(circle at 20% 15%,rgba(240,180,41,.12),transparent 40%),radial-gradient(circle at 85% 85%,rgba(255,255,255,.06),transparent 45%)}
    .kartu{background:#fff;border-radius:22px;max-width:460px;width:100%;padding:34px 30px 28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .logo{width:64px;height:64px;border-radius:18px;background:#F0B429;color:#123D22;font-weight:800;font-size:25px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;letter-spacing:.5px}
    h1{font-size:23px;color:#123D22;margin-bottom:10px}
    p{font-size:15px;line-height:1.55;color:#2B3A30;margin-bottom:10px}
    .sub{font-size:13px;color:#5A6A60}
    .loader{height:6px;background:#E3F1E7;border-radius:99px;overflow:hidden;margin:20px 0 16px}
    .loader i{display:block;height:100%;width:35%;background:#1C7A3C;border-radius:99px;animation:geser 1.4s ease-in-out infinite}
    @keyframes geser{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    .status{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#5A6A60;background:#F3F6F2;border-radius:99px;padding:6px 12px;margin-top:4px}
    .titik{width:8px;height:8px;border-radius:50%;background:#F0B429;animation:kedip 1.2s ease-in-out infinite}
    @keyframes kedip{50%{opacity:.25}}
    .siap .titik{background:#1C7A3C;animation:none}
    button{margin-top:16px;border:0;background:#1C7A3C;color:#fff;font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:10px 18px;cursor:pointer}
    button:hover{background:#155E2E}
    .kaki{margin-top:18px;font-size:11.5px;color:#8A968F}
  </style>
</head>
<body>
  <main class="kartu" role="main">
    <div class="logo" aria-hidden="true">SQ</div>
    <h1>Sistem sedang diperbarui</h1>
    <p>Siskom Qudwah sedang dipasang pembaruan. Mohon tunggu beberapa menit, data Anda aman.</p>
    <div class="loader" aria-hidden="true"><i></i></div>
    <p class="sub">Halaman ini akan membuka aplikasi lagi secara otomatis begitu pembaruan selesai. Tidak perlu menutup atau memuat ulang.</p>
    <div class="status" id="status"><span class="titik"></span><span id="teks">Menunggu pembaruan selesai…</span></div>
    <div><button type="button" id="coba">Coba buka sekarang</button></div>
    <div class="kaki">Jundicomp © 2026 · Siskom Qudwah</div>
  </main>
  <script>
    (function () {
      var dasar = location.pathname.replace(/[^/]*$/, ''); // mis. /sitqudwah/
      var teks = document.getElementById('teks');
      var kotak = document.getElementById('status');
      var percobaan = 0;
      function bukaAplikasi() {
        // Parameter ?v= memaksa browser mengambil index.html baru (bukan salinan cache).
        location.replace(dasar + '?v=' + Date.now() + (location.hash || ''));
      }
      function cek() {
        percobaan++;
        fetch(dasar + '?cek=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (html) {
            if (html && html.indexOf('HALAMAN-PEMELIHARAAN-SQ') === -1 && html.indexOf('<div id="root"') !== -1) {
              kotak.className = 'status siap';
              teks.textContent = 'Pembaruan selesai. Membuka aplikasi…';
              setTimeout(bukaAplikasi, 1500);
            } else {
              teks.textContent = 'Menunggu pembaruan selesai… (dicek ' + percobaan + 'x)';
            }
          })
          .catch(function () { teks.textContent = navigator.onLine === false ? 'Menunggu koneksi internet…' : 'Menunggu pembaruan selesai… (dicek ' + percobaan + 'x)'; });
      }
      document.getElementById('coba').onclick = bukaAplikasi;
      cek();
      setInterval(cek, 20000);
    })();
  </script>
</body>
</html>
